[package]
name = "rust_client"
version = "0.1.0"
edition = "2021"

[features]
native-webrtc = ["dep:webrtc", "dep:webrtc-ice", "dep:rtp"]

[[bin]]
name = "live_speech_smoke"
path = "src/bin/live_speech_smoke.rs"
test = false

[dependencies]
cpal = "0.15"
hound = "3.5"
opus = "0.3"
rubato = "0.14"
webrtc-vad = "0.4"
serialport = "4.4"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bytes = "1"
crossbeam = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
webrtc = { version = "0.17.1", optional = true }
webrtc-ice = { version = "0.17.1", optional = true }
rtp = { version = "0.17.1", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
