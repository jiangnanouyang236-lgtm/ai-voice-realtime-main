name: wzk-ai-voice-v4

x-python-service: &python-service
  image: "${WZK_PYTHON_IMAGE:-wzk-ai-voice-python}:${WZK_IMAGE_TAG:-dev}"
  build:
    context: .
    dockerfile: docker/python-services.Dockerfile
  init: true
  restart: unless-stopped
  working_dir: /app
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "5"
  networks:
    - wzk-ai-voice-net
  labels:
    com.wzk.stack: ai-voice
    com.wzk.version: v4
  environment: &python-common-env
    CONFIG_DATABASE_URL: ${CONFIG_DATABASE_URL:-}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
    LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}

services:
  wzk-stt-grpc:
    <<: *python-service
    command: ["python", "stt/stt_grpc_server.py"]
    labels:
      com.wzk.stack: ai-voice
      com.wzk.version: v4
      com.wzk.role: stt-grpc
    environment:
      <<: *python-common-env
      STT_GRPC_BIND_HOST: 0.0.0.0
      STT_GRPC_SERVER_PORT: 50054
      STT_GRPC_MAX_WORKERS: ${STT_GRPC_MAX_WORKERS:-10}
      STT_PROVIDER: ${STT_PROVIDER:-qwen}
      STT_MAX_CONCURRENT_INFERENCES: ${STT_MAX_CONCURRENT_INFERENCES:-8}
      QWEN_ASR_BASE_URL: ${QWEN_ASR_BASE_URL:-}
      QWEN_ASR_API_KEY: ${QWEN_ASR_API_KEY:-}
      QWEN_ASR_MODEL: ${QWEN_ASR_MODEL:-Qwen3-ASR-1.7B}
      QWEN_ASR_TIMEOUT: ${QWEN_ASR_TIMEOUT:-30}
    ports:
      - "${AI_VOICE_HOST_BIND_IP:-127.0.0.1}:${STT_GRPC_HOST_PORT:-50054}:50054"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 50054), 2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 6

  wzk-llm-grpc:
    <<: *python-service
    command: ["python", "llm/llm_grpc_server.py"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      com.wzk.stack: ai-voice
      com.wzk.version: v4
      com.wzk.role: llm-grpc
    environment:
      <<: *python-common-env
      LLM_GRPC_BIND_HOST: 0.0.0.0
      LLM_GRPC_SERVER_PORT: 50053
      LLM_GRPC_MAX_WORKERS: ${LLM_GRPC_MAX_WORKERS:-10}
      LLM_ADMIN_BIND_HOST: 0.0.0.0
      LLM_ADMIN_PORT: 18053
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen3-5-9b}
      LLM_ROUTER_BASE_URL: ${LLM_ROUTER_BASE_URL:-}
      LLM_ROUTER_API_KEY: ${LLM_ROUTER_API_KEY:-}
      LLM_ROUTER_MODEL_NAME: ${LLM_ROUTER_MODEL_NAME:-}
      LLM_HTTP_TIMEOUT_SEC: ${LLM_HTTP_TIMEOUT_SEC:-60}
      LLM_ROUTER_HTTP_TIMEOUT_SEC: ${LLM_ROUTER_HTTP_TIMEOUT_SEC:-8}
      LLM_SYNC_STREAM_EXECUTOR_MAX_WORKERS: ${LLM_SYNC_STREAM_EXECUTOR_MAX_WORKERS:-4}
      LLM_SYNC_STREAM_QUEUE_MAXSIZE: ${LLM_SYNC_STREAM_QUEUE_MAXSIZE:-16}
      LLM_MAX_TOOL_ROUNDS: ${LLM_MAX_TOOL_ROUNDS:-5}
      LLM_TOOL_LATENCY_EXPERIMENT: ${LLM_TOOL_LATENCY_EXPERIMENT:-true}
      LLM_TOOL_ROUTER_CLASSIFIER: ${LLM_TOOL_ROUTER_CLASSIFIER:-true}
      LLM_TOOL_ROUTER_CLASSIFIER_MAX_TOKENS: ${LLM_TOOL_ROUTER_CLASSIFIER_MAX_TOKENS:-1}
      LLM_TOOL_ROUTER_CLASSIFIER_TIMEOUT_MS: ${LLM_TOOL_ROUTER_CLASSIFIER_TIMEOUT_MS:-3000}
      LLM_TOOL_ROUTER_CLASSIFIER_PROMPT_CHAR_LIMIT: ${LLM_TOOL_ROUTER_CLASSIFIER_PROMPT_CHAR_LIMIT:-8192}
      LLM_TOOL_ROUTER_CLASSIFIER_HISTORY_MESSAGES: ${LLM_TOOL_ROUTER_CLASSIFIER_HISTORY_MESSAGES:-10}
      LLM_TOOL_ROUTER_CLASSIFIER_HISTORY_MESSAGE_CHARS: ${LLM_TOOL_ROUTER_CLASSIFIER_HISTORY_MESSAGE_CHARS:-200}
      LLM_TOOL_ROUTER_CLASSIFIER_HISTORY_CHAR_BUDGET: ${LLM_TOOL_ROUTER_CLASSIFIER_HISTORY_CHAR_BUDGET:-700}
      LLM_TOOL_ROUTER_CLASSIFIER_FALLBACK_HISTORY_MESSAGES: ${LLM_TOOL_ROUTER_CLASSIFIER_FALLBACK_HISTORY_MESSAGES:-3}
      LLM_COMPLEX_WORKFLOW_ENABLED: ${LLM_COMPLEX_WORKFLOW_ENABLED:-false}
      LLM_VISION_ENABLED: ${LLM_VISION_ENABLED:-true}
      LLM_VISION_GATEWAY_BASE_URL: ${LLM_VISION_GATEWAY_BASE_URL:-http://host.docker.internal:8282}
      LLM_VISION_GATEWAY_TOKEN: ${VISION_INTERNAL_TOKEN:-}
      LLM_VISION_FETCH_TIMEOUT_SEC: ${LLM_VISION_FETCH_TIMEOUT_SEC:-8}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      WEBSEARCH_API_KEY: ${WEBSEARCH_API_KEY:-}
      ROBOTS_TASK_SERVICE_URL: ${ROBOTS_TASK_SERVICE_URL:-https://tour.windaka.com/mcp}
      ROBOTS_TASK_SERVICE_AUTHORIZATION: ${ROBOTS_TASK_SERVICE_AUTHORIZATION:-}
      COGNITIVE_REPORT_MQTT_ENABLED: ${COGNITIVE_REPORT_MQTT_ENABLED:-false}
      COGNITIVE_REPORT_MQTT_HOST: ${COGNITIVE_REPORT_MQTT_HOST:-}
      COGNITIVE_REPORT_MQTT_PORT: ${COGNITIVE_REPORT_MQTT_PORT:-1883}
      COGNITIVE_REPORT_MQTT_USERNAME: ${COGNITIVE_REPORT_MQTT_USERNAME:-}
      COGNITIVE_REPORT_MQTT_PASSWORD: ${COGNITIVE_REPORT_MQTT_PASSWORD:-}
      COGNITIVE_REPORT_MQTT_CLIENT_ID: ${COGNITIVE_REPORT_MQTT_CLIENT_ID:-}
      COGNITIVE_REPORT_MQTT_TOPIC_PREFIX: ${COGNITIVE_REPORT_MQTT_TOPIC_PREFIX:-windaka}
      COGNITIVE_REPORT_TOPIC_SUFFIX: ${COGNITIVE_REPORT_TOPIC_SUFFIX:-device/cog_ass_report}
      COGNITIVE_REPORT_METHOD: ${COGNITIVE_REPORT_METHOD:-/device/cog_ass_report}
    ports:
      - "${AI_VOICE_HOST_BIND_IP:-127.0.0.1}:${LLM_GRPC_HOST_PORT:-50053}:50053"
      - "${AI_VOICE_HOST_BIND_IP:-127.0.0.1}:${LLM_ADMIN_HOST_PORT:-18053}:18053"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 50053), 2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 6

  wzk-tts-grpc:
    <<: *python-service
    command: ["python", "tts/tts_grpc_server.py"]
    labels:
      com.wzk.stack: ai-voice
      com.wzk.version: v4
      com.wzk.role: tts-grpc
    environment:
      <<: *python-common-env
      TTS_GRPC_BIND_HOST: 0.0.0.0
      TTS_GRPC_SERVER_PORT: 50052
      TTS_GRPC_MAX_WORKERS: ${TTS_GRPC_MAX_WORKERS:-5}
      TTS_ADMIN_BIND_HOST: 0.0.0.0
      TTS_ADMIN_PORT: 18052
      QWEN3_TTS_CUSTOM_VOICE_WS_URL: ${QWEN3_TTS_CUSTOM_VOICE_WS_URL:-}
      QWEN3_TTS_CUSTOM_VOICE_API_KEY: ${QWEN3_TTS_CUSTOM_VOICE_API_KEY:-}
      QWEN3_TTS_CUSTOM_VOICE_MODEL: ${QWEN3_TTS_CUSTOM_VOICE_MODEL:-qwen3-tts}
      QWEN3_TTS_BASE_WS_URL: ${QWEN3_TTS_BASE_WS_URL:-}
      QWEN3_TTS_BASE_API_KEY: ${QWEN3_TTS_BASE_API_KEY:-}
      QWEN3_TTS_BASE_MODEL: ${QWEN3_TTS_BASE_MODEL:-qwen3-tts-base}
      LOCAL_QWEN3_TTS_SUPPORTED_VOICES: ${LOCAL_QWEN3_TTS_SUPPORTED_VOICES:-serena,aiden,dylan,eric,ono_anna,ryan,sohee,uncle_fu,vivian}
      LOCAL_QWEN3_TTS_VOICE: ${LOCAL_QWEN3_TTS_VOICE:-serena}
      LOCAL_QWEN3_TTS_LANGUAGE: ${LOCAL_QWEN3_TTS_LANGUAGE:-Chinese}
      LOCAL_QWEN3_TTS_TASK_TYPE: ${LOCAL_QWEN3_TTS_TASK_TYPE:-CustomVoice}
      LOCAL_QWEN3_TTS_INSTRUCTIONS: ${LOCAL_QWEN3_TTS_INSTRUCTIONS:-}
      LOCAL_QWEN3_TTS_SOURCE_SAMPLE_RATE: ${LOCAL_QWEN3_TTS_SOURCE_SAMPLE_RATE:-24000}
      LOCAL_QWEN3_TTS_CONNECT_TIMEOUT_SEC: ${LOCAL_QWEN3_TTS_CONNECT_TIMEOUT_SEC:-8}
      LOCAL_QWEN3_TTS_RECV_TIMEOUT_SEC: ${LOCAL_QWEN3_TTS_RECV_TIMEOUT_SEC:-60}
      TTS_AUDIO_QUEUE_MAXSIZE: ${TTS_AUDIO_QUEUE_MAXSIZE:-100}
      TTS_AUDIO_QUEUE_PUT_TIMEOUT_SEC: ${TTS_AUDIO_QUEUE_PUT_TIMEOUT_SEC:-2}
    ports:
      - "${AI_VOICE_HOST_BIND_IP:-127.0.0.1}:${TTS_GRPC_HOST_PORT:-50052}:50052"
      - "${AI_VOICE_HOST_BIND_IP:-127.0.0.1}:${TTS_ADMIN_HOST_PORT:-18052}:18052"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 50052), 2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 6

  wzk-python-gateway:
    <<: *python-service
    command: ["python", "gateway/gateway_server.py"]
    labels:
      com.wzk.stack: ai-voice
      com.wzk.version: v4
      com.wzk.role: python-gateway
    depends_on:
      wzk-stt-grpc:
        condition: service_healthy
      wzk-llm-grpc:
        condition: service_healthy
      wzk-tts-grpc:
        condition: service_healthy
    environment:
      <<: *python-common-env
      GATEWAY_BIND_HOST: 0.0.0.0
      GATEWAY_BIND_PORT: 7860
      STT_SERVICE_URL: grpc://wzk-stt-grpc:50054
      LLM_SERVICE_URL: grpc://wzk-llm-grpc:50053
      TTS_SERVICE_URL: grpc://wzk-tts-grpc:50052
      GATEWAY_REQUIRE_ROBOT_SECRET: ${GATEWAY_REQUIRE_ROBOT_SECRET:-true}
      GATEWAY_INTERNAL_VOICE_WS_ENABLED: ${GATEWAY_INTERNAL_VOICE_WS_ENABLED:-true}
      GATEWAY_INTERNAL_VOICE_CLIENT_EVENT_MODE: ${GATEWAY_INTERNAL_VOICE_CLIENT_EVENT_MODE:-active}
      GATEWAY_REQUEST_QUEUE_MAXSIZE: ${GATEWAY_REQUEST_QUEUE_MAXSIZE:-1}
      STT_AUDIO_CONTEXT_TO_LLM: ${STT_AUDIO_CONTEXT_TO_LLM:-true}
      GATEWAY_STT_RPC_TIMEOUT_SEC: ${GATEWAY_STT_RPC_TIMEOUT_SEC:-15}
      GATEWAY_LLM_STREAM_RPC_TIMEOUT_SEC: ${GATEWAY_LLM_STREAM_RPC_TIMEOUT_SEC:-120}
      GATEWAY_TTS_STREAM_RPC_TIMEOUT_SEC: ${GATEWAY_TTS_STREAM_RPC_TIMEOUT_SEC:-120}
      GATEWAY_LLM_SESSION_CLEANUP_TIMEOUT_SEC: ${GATEWAY_LLM_SESSION_CLEANUP_TIMEOUT_SEC:-3}
      GATEWAY_COMPLEX_WORKFLOW_ENABLED: ${GATEWAY_COMPLEX_WORKFLOW_ENABLED:-false}
      GATEWAY_WORKFLOW_RPC_TIMEOUT_SEC: ${GATEWAY_WORKFLOW_RPC_TIMEOUT_SEC:-30}
      GATEWAY_WORKFLOW_STREAM_TIMEOUT_SEC: ${GATEWAY_WORKFLOW_STREAM_TIMEOUT_SEC:-120}
      GATEWAY_WORKFLOW_PLAYBACK_TIMEOUT_SEC: ${GATEWAY_WORKFLOW_PLAYBACK_TIMEOUT_SEC:-30}
      GATEWAY_WS_SEND_TIMEOUT_SEC: ${GATEWAY_WS_SEND_TIMEOUT_SEC:-5}
      GATEWAY_WS_AUDIO_SLOW_SEND_MS: ${GATEWAY_WS_AUDIO_SLOW_SEND_MS:-1500}
      GATEWAY_WS_SLOW_SEND_MAX_STRIKES: ${GATEWAY_WS_SLOW_SEND_MAX_STRIKES:-3}
      LLM_TTS_IDLE_TIMEOUT_SEC: ${LLM_TTS_IDLE_TIMEOUT_SEC:-20}
      LLM_TTS_THREAD_JOIN_TIMEOUT_SEC: ${LLM_TTS_THREAD_JOIN_TIMEOUT_SEC:-5}
      TRACE_ENABLED: ${TRACE_ENABLED:-true}
      TRACE_MAX_EVENTS: ${TRACE_MAX_EVENTS:-10000}
      TRACE_MAX_ROUNDS: ${TRACE_MAX_ROUNDS:-1000}
      TRACE_TEXT_MAX_CHARS: ${TRACE_TEXT_MAX_CHARS:-300}
      TRACE_ERROR_MAX_CHARS: ${TRACE_ERROR_MAX_CHARS:-1000}
      GATEWAY_MAX_AUDIO_RAW_BYTES: ${GATEWAY_MAX_AUDIO_RAW_BYTES:-400000}
      GATEWAY_MAX_AUDIO_DURATION_MS: ${GATEWAY_MAX_AUDIO_DURATION_MS:-10000}
      GATEWAY_ALLOWED_AUDIO_SAMPLE_RATE: ${GATEWAY_ALLOWED_AUDIO_SAMPLE_RATE:-16000}
      GATEWAY_ALLOWED_AUDIO_CHANNELS: ${GATEWAY_ALLOWED_AUDIO_CHANNELS:-1}
      GATEWAY_ALLOWED_SAMPLE_WIDTH_BYTES: ${GATEWAY_ALLOWED_SAMPLE_WIDTH_BYTES:-2}
      OPUS_BITRATE_BPS: ${OPUS_BITRATE_BPS:-16000}
      GATEWAY_RTC_ICE_SERVERS: ${GATEWAY_RTC_ICE_SERVERS:-}
      GATEWAY_RTC_AUDIO_DIRECTION: ${GATEWAY_RTC_AUDIO_DIRECTION:-sendrecv}
      GATEWAY_RTC_AUDIO_CODEC: ${GATEWAY_RTC_AUDIO_CODEC:-opus}
      SINGING_AUDIO_ROOT: /app/singing/audio
    volumes:
      - "${SINGING_AUDIO_V4_HOST_DIR:-./singing/audio}:/app/singing/audio:ro"
    ports:
      - "${AI_VOICE_HOST_BIND_IP:-127.0.0.1}:${PYTHON_GATEWAY_HOST_PORT:-7860}:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6

  wzk-admin-api:
    <<: *python-service
    command: ["python", "admin-ui/backend/app.py"]
    profiles: ["admin"]
    labels:
      com.wzk.stack: ai-voice
      com.wzk.version: v4
      com.wzk.role: admin-api
    depends_on:
      wzk-python-gateway:
        condition: service_healthy
      wzk-llm-grpc:
        condition: service_healthy
      wzk-tts-grpc:
        condition: service_healthy
    environment:
      <<: *python-common-env
      ADMIN_API_HOST: 0.0.0.0
      ADMIN_API_PORT: 18100
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-43200}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_AUTH_DISABLED: ${ADMIN_AUTH_DISABLED:-false}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      LLM_INTERNAL_BASE_URL: http://wzk-llm-grpc:18053
      GATEWAY_INTERNAL_BASE_URL: http://wzk-python-gateway:7860
      TTS_INTERNAL_BASE_URL: http://wzk-tts-grpc:18052
    ports:
      - "${AI_VOICE_HOST_BIND_IP:-127.0.0.1}:${ADMIN_API_HOST_PORT:-18100}:18100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18100/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6

  wzk-mcp-utils:
    <<: *python-service
    command: ["python", "mcp_servers/utils_sse_server.py"]
    profiles: ["mcp"]
    labels:
      com.wzk.stack: ai-voice
      com.wzk.version: v4
      com.wzk.role: mcp-utils
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
    ports:
      - "${AI_VOICE_HOST_BIND_IP:-127.0.0.1}:${MCP_UTILS_HOST_PORT:-5004}:5004"

  wzk-mcp-robot:
    <<: *python-service
    command: ["python", "mcp_servers/robot_sse_server.py"]
    profiles: ["mcp"]
    labels:
      com.wzk.stack: ai-voice
      com.wzk.version: v4
      com.wzk.role: mcp-robot
      com.wzk.side-effect: external-write
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      ROBOT_MQTT_HOST: ${ROBOT_MQTT_HOST:-}
      ROBOT_MQTT_PORT: ${ROBOT_MQTT_PORT:-1883}
      ROBOT_MQTT_USERNAME: ${ROBOT_MQTT_USERNAME:-}
      ROBOT_MQTT_PASSWORD: ${ROBOT_MQTT_PASSWORD:-}
      ROBOT_MQTT_TOPIC_PREFIX: ${ROBOT_MQTT_TOPIC_PREFIX:-windaka}
      ROBOT_MQTT_DEFAULT_ROBOT_ID: ${ROBOT_MQTT_DEFAULT_ROBOT_ID:-test_01}
    ports:
      - "${AI_VOICE_HOST_BIND_IP:-127.0.0.1}:${MCP_ROBOT_HOST_PORT:-5003}:5003"

  wzk-mcp-singing:
    <<: *python-service
    command: ["python", "mcp_servers/singing_sse_server.py"]
    profiles: ["mcp"]
    labels:
      com.wzk.stack: ai-voice
      com.wzk.version: v4
      com.wzk.role: mcp-singing
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      SINGING_MCP_PORT: 5005
      SINGING_CATALOG_PATH: /app/singing/catalog.json
      SINGING_VOICES_PATH: /app/singing/voices.json
      SINGING_DEFAULT_VOICE_ID: ${SINGING_DEFAULT_VOICE_ID:-serena-v1}
    ports:
      - "${AI_VOICE_HOST_BIND_IP:-127.0.0.1}:${MCP_SINGING_HOST_PORT:-5005}:5005"

networks:
  wzk-ai-voice-net:
    name: wzk-ai-voice-net
