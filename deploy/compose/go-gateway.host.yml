name: ai-voice-v3

services:
  go-gateway:
    image: ${GO_VOICE_GATEWAY_IMAGE:-ai-voice-go-gateway:ubuntu22-amd64}
    restart: unless-stopped
    command: ["/go_voice_gateway"]
    network_mode: host
    environment:
      GO_VOICE_GATEWAY_ADDR: ${GO_VOICE_GATEWAY_ADDR:-0.0.0.0:8282}
      GO_VOICE_GATEWAY_RTC_ENABLED: "true"
      GO_VOICE_GATEWAY_REQUIRE_ROBOT_SECRET: ${GO_VOICE_GATEWAY_REQUIRE_ROBOT_SECRET:-true}
      GO_VOICE_GATEWAY_DEVICE_AUTH_BACKEND: python_gateway
      GO_VOICE_GATEWAY_ASR_PROCESSOR: python_gateway
      GO_VOICE_GATEWAY_ASR_PYTHON_GATEWAY_WS_URL: ${GO_VOICE_GATEWAY_ASR_PYTHON_GATEWAY_WS_URL:-ws://127.0.0.1:7860/ws}
      GO_VOICE_GATEWAY_ASR_PYTHON_GATEWAY_CONNECTION_MODE: ${GO_VOICE_GATEWAY_ASR_PYTHON_GATEWAY_CONNECTION_MODE:-session}
      GO_VOICE_GATEWAY_ASR_PYTHON_GATEWAY_TOTAL_TIMEOUT_MS: ${GO_VOICE_GATEWAY_ASR_PYTHON_GATEWAY_TOTAL_TIMEOUT_MS:-45000}
      GO_VOICE_GATEWAY_ASR_PYTHON_GATEWAY_SESSION_IDLE_RECYCLE_MS: ${GO_VOICE_GATEWAY_ASR_PYTHON_GATEWAY_SESSION_IDLE_RECYCLE_MS:-30000}
      GO_VOICE_GATEWAY_ALLOWED_ORIGINS: ${GO_VOICE_GATEWAY_ALLOWED_ORIGINS:-*}
      GO_VOICE_GATEWAY_DOWNLINK_AUDIO_TRANSPORT: ${GO_VOICE_GATEWAY_DOWNLINK_AUDIO_TRANSPORT:-webrtc_rtp}
      GO_VOICE_GATEWAY_ICE_TRANSPORT_POLICY: ${GO_VOICE_GATEWAY_ICE_TRANSPORT_POLICY:-all}
      GO_VOICE_GATEWAY_ICE_NETWORK_TYPES: ${GO_VOICE_GATEWAY_ICE_NETWORK_TYPES:-udp4}
      GO_VOICE_GATEWAY_RTC_UDP_MIN_PORT: ${GO_VOICE_GATEWAY_RTC_UDP_MIN_PORT:-35500}
      GO_VOICE_GATEWAY_RTC_UDP_MAX_PORT: ${GO_VOICE_GATEWAY_RTC_UDP_MAX_PORT:-35600}
      GO_VOICE_GATEWAY_ICE_SERVERS: ${GO_VOICE_GATEWAY_ICE_SERVERS:-}
      GO_VOICE_GATEWAY_LOG_FORMAT: ${GO_VOICE_GATEWAY_LOG_FORMAT:-json}
      GO_VOICE_GATEWAY_LOG_LEVEL: ${GO_VOICE_GATEWAY_LOG_LEVEL:-info}
      GO_VOICE_GATEWAY_VISION_INTERNAL_TOKEN: ${VISION_INTERNAL_TOKEN:-}
      GO_VOICE_GATEWAY_TURN_GATE_SHADOW_ENABLED: ${GO_VOICE_GATEWAY_TURN_GATE_SHADOW_ENABLED:-false}
      GO_VOICE_GATEWAY_TURN_GATE_ACTIVE_ENABLED: ${GO_VOICE_GATEWAY_TURN_GATE_ACTIVE_ENABLED:-false}
      GO_VOICE_GATEWAY_TURN_GATE_ACTIVE_DEADLINE_MS: ${GO_VOICE_GATEWAY_TURN_GATE_ACTIVE_DEADLINE_MS:-300}
      GO_VOICE_GATEWAY_TURN_GATE_SHADOW_TIMEOUT_MS: ${GO_VOICE_GATEWAY_TURN_GATE_SHADOW_TIMEOUT_MS:-5000}
      GO_VOICE_GATEWAY_TURN_GATE_SHADOW_SNAPSHOT_GRACE_MS: ${GO_VOICE_GATEWAY_TURN_GATE_SHADOW_SNAPSHOT_GRACE_MS:-30}
      GO_VOICE_GATEWAY_BARGE_IN_ENABLED: ${GO_VOICE_GATEWAY_BARGE_IN_ENABLED:-true}
    healthcheck:
      test: ["CMD", "/go_voice_gateway", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
