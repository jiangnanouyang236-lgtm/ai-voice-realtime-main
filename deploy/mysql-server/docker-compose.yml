services:
  wzk-mysql:
    image: mysql:8.4
    container_name: wzk-mysql
    restart: unless-stopped

    ports:
      - "15501:3306"

    environment:
      MYSQL_ROOT_PASSWORD: wzk_xiaowen_MySQL
      MYSQL_DATABASE: wzk_ai_voice
      MYSQL_USER: wzk
      MYSQL_PASSWORD: wzk_ai_voice_Server
      TZ: Asia/Shanghai

    volumes:
      # MySQL 数据持久化
      - ./mysql/data:/var/lib/mysql
      # MySQL 配置文件
      - ./mysql/conf.d:/etc/mysql/conf.d
      # 初始化 SQL，只在首次创建数据库时执行
      - ./mysql/init:/docker-entrypoint-initdb.d
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-time-zone=+08:00"
      ]
