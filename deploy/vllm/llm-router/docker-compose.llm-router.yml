services:
  wzk-llm:
    image: vllm/vllm-openai:v0.21.0
    container_name: wzk-llm-router
    restart: unless-stopped
    ipc: host

    ports:
      - "${LLM_VLLM_PORT}:8000"

    volumes:
      - /home/chase/datasets/wzk/models:/models
      - /home/chase/datasets/wzk/hf-cache:/root/.cache/huggingface

    environment:
      NVIDIA_VISIBLE_DEVICES: "${LLM_CUDA_VISIBLE_DEVICES}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /root/.cache/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLM_CUDA_VISIBLE_DEVICES}"]
              capabilities: ["gpu"]

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

    command:
      - --model
      - ${LLM_MODEL_PATH}
      - --served-model-name
      - ${LLM_SERVED_MODEL_NAME}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # 精度
      - --dtype
      - auto
      # GPU / KV cache
      - --gpu-memory-utilization
      - ${LLM_GPU_MEMORY_UTILIZATION}
      - --max-model-len
      - ${LLM_MAX_MODEL_LEN}
      - --max-num-seqs
      - ${LLM_MAX_NUM_SEQS}
      - --max-num-batched-tokens
      - ${LLM_MAX_NUM_BATCHED_TOKENS}
      - --enable-prefix-caching
      # API
      - --api-key
      - ${LLM_VLLM_API_KEY}

    networks:
      - wzk-ai-net

networks:
  wzk-ai-net:
    external: true
